<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mateway Office Watch</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/watch.css" />
  </head>
  <body class="watch-body">
    <aside class="watch-sidebar">
      <div class="brand">Office Watch</div>
      <button class="primary" id="refresh-watch">刷新 Sessions</button>
      <div id="watch-sessions" class="session-list"></div>
    </aside>
    <main class="watch-stage">
      <header class="watch-top">
        <div>
          <h1 id="watch-title">Mateway Runtime</h1>
          <p id="watch-subtitle">实时观察任务从发布到完成的执行过程</p>
        </div>
        <a href="/">返回 Console</a>
      </header>
      <section class="office-floor">
        <div class="pixel-wall">
          <div class="clock">TRACE</div>
          <div class="board" id="watch-board">idle</div>
        </div>
        <div class="desk">
          <div class="monitor" id="watch-monitor">等待任务</div>
          <div class="agent-avatar idle" id="agent-avatar"><span></span></div>
          <div class="keyboard"></div>
        </div>
        <div class="shelf">
          <div></div><div></div><div></div>
        </div>
      </section>
      <section class="work-grid">
        <div class="watch-panel">
          <div class="panel-head">
            <h2>Agent State</h2>
            <span id="agent-state-pill" class="state-pill idle">Idle</span>
          </div>
          <div id="agent-state-detail" class="state-detail">等待任务</div>
        </div>
        <div class="watch-panel">
          <div class="panel-head">
            <h2>Skills</h2>
            <span class="meta">本轮上下文注入</span>
          </div>
          <div id="watch-skills" class="skill-flow"></div>
        </div>
        <div class="watch-panel wide">
          <div class="panel-head">
            <h2>Tools</h2>
            <span class="meta">开始、参数、结果和证据</span>
          </div>
          <div id="watch-tools" class="tool-flow"></div>
        </div>
      </section>
      <section class="watch-metrics" id="watch-metrics"></section>
    </main>
    <aside class="watch-inspector">
      <h2>Timeline</h2>
      <div class="timeline-tabs" id="timeline-tabs">
        <button data-filter="all" class="active">All</button>
        <button data-filter="tool">Tools</button>
        <button data-filter="skill">Skills</button>
        <button data-filter="model">Model</button>
      </div>
      <div id="watch-timeline" class="timeline"></div>
    </aside>
    <script src="/static/watch.js"></script>
  </body>
</html>
