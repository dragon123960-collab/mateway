name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          name="mateway_${{ matrix.goos }}_${{ matrix.goarch }}"
          staging="dist/${name}"
          mkdir -p "${staging}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "${staging}/mateway${{ matrix.ext }}" ./cmd/mateway
          cp -R assets "${staging}/assets"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
