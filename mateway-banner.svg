<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.45" stop-color="#0E1B31"/>
      <stop offset="1" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="130" x2="1420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13243E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="275" y1="260" x2="1330" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E1F5"/>
      <stop offset="0.55" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#F6D365"/>
    </linearGradient>
    <filter id="shadow" x="120" y="70" width="1360" height="410" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; fill: #F8FAFC; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; fill: #CBD5E1; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 600; fill: #DDE7F4; }
      .muted { fill: #8EA4C6; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-weight: 600; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="1600" height="520" rx="0" fill="url(#bg)"/>

  <circle cx="122" cy="78" r="150" fill="#2DD4BF" opacity="0.08"/>
  <circle cx="1450" cy="455" r="210" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="930" cy="-20" r="170" fill="#F59E0B" opacity="0.08"/>

  <g opacity="0.28">
    <path d="M0 450 C260 330, 410 570, 680 430 S1120 310, 1600 390" stroke="#60A5FA" stroke-width="2"/>
    <path d="M0 120 C270 250, 520 20, 820 160 S1200 260, 1600 120" stroke="#A78BFA" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="170" y="96" width="1260" height="330" rx="34" fill="url(#card)" stroke="#28425F" stroke-width="1.5"/>
  </g>

  <text x="238" y="180" class="title" font-size="68">Mateway</text>
  <text x="240" y="228" class="sub" font-size="26">Pi-style local agent runtime for real workspaces</text>

  <g transform="translate(242 270)">
    <rect x="0" y="0" width="187" height="46" rx="23" fill="#0F766E" opacity="0.34" stroke="#5EEAD4" stroke-opacity="0.65"/>
    <text x="25" y="30" class="small" font-size="18">Hook-first</text>

    <rect x="212" y="0" width="230" height="46" rx="23" fill="#4338CA" opacity="0.34" stroke="#A5B4FC" stroke-opacity="0.65"/>
    <text x="238" y="30" class="small" font-size="18">White-box memory</text>

    <rect x="470" y="0" width="220" height="46" rx="23" fill="#92400E" opacity="0.34" stroke="#FCD34D" stroke-opacity="0.65"/>
    <text x="495" y="30" class="small" font-size="18">Traceable tools</text>

    <rect x="718" y="0" width="242" height="46" rx="23" fill="#1E3A8A" opacity="0.34" stroke="#93C5FD" stroke-opacity="0.65"/>
    <text x="744" y="30" class="small" font-size="18">CLI · Feishu · Skills</text>
  </g>

  <g transform="translate(250 360)">
    <text class="mono" font-size="20">receive</text>
    <path d="M92 9 H151" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="168" class="mono" font-size="20">context_hook</text>
    <path d="M314 9 H373" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="390" class="mono" font-size="20">act</text>
    <path d="M434 9 H493" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="510" class="mono" font-size="20">observe_hook</text>
    <path d="M656 9 H715" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="732" class="mono" font-size="20">reply</text>
  </g>

  <g transform="translate(1015 150)">
    <rect x="0" y="0" width="326" height="202" rx="24" fill="#07111F" opacity="0.75" stroke="#334155"/>
    <circle cx="45" cy="45" r="14" fill="#5EEAD4"/>
    <text x="76" y="53" class="small" font-size="19">Single agent core</text>
    <circle cx="45" cy="92" r="14" fill="#A5B4FC"/>
    <text x="76" y="100" class="small" font-size="19">Safe tool policy</text>
    <circle cx="45" cy="139" r="14" fill="#FCD34D"/>
    <text x="76" y="147" class="small" font-size="19">Markdown memory</text>
    <circle cx="45" cy="186" r="14" fill="#93C5FD"/>
    <text x="76" y="194" class="small" font-size="19">Local trace ledger</text>
  </g>
